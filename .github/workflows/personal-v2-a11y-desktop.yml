name: Personal V2 A11y Windows Desktop

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional official V2 tag; empty picks the oldest unshipped Desktop version."
        required: false
        type: string
      verify_only:
        description: "Rebuild an existing personal Windows Desktop version without tagging or publishing. Requires upstream_tag."
        required: false
        type: boolean
        default: false
      hotfix_suffix:
        description: "Optional manual hotfix suffix such as r1; publish a separate immutable Desktop release for upstream_tag."
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: personal-v2-a11y-desktop
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'aimansour/opencode' && vars.PERSONAL_A11Y_STOP != 'true'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.pick.outputs.build }}
      tag: ${{ steps.pick.outputs.tag }}
      release_tag: ${{ steps.pick.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
          sparse-checkout: .github/scripts/personal-v2
      - id: pick
        name: Select a tested personal CLI and unshipped official V2 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag || '' }}
          VERIFY_ONLY: ${{ inputs.verify_only || 'false' }}
          HOTFIX_SUFFIX: ${{ inputs.hotfix_suffix || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" && ! "$REQUESTED_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid official V2 tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          if [[ "$VERIFY_ONLY" == true && -z "$REQUESTED_TAG" ]]; then
            echo 'Verification-only runs must specify an already-published V2 tag.' >&2
            exit 1
          fi
          if [[ -n "$HOTFIX_SUFFIX" ]] && { [[ "$EVENT_NAME" != workflow_dispatch ]] ||
                [[ -z "$REQUESTED_TAG" ]] || [[ "$VERIFY_ONLY" == true ]] ||
                [[ ! "$HOTFIX_SUFFIX" =~ ^r[1-9][0-9]*$ ]]; }; then
            echo 'Manual hotfix requires explicit upstream_tag, a suffix such as r1, and verify_only=false.' >&2
            exit 1
          fi
          pr="$(gh api repos/anomalyco/opencode/pulls/51084)"
          if [[ "$(jq -r '.merged' <<< "$pr")" == true ]]; then
            echo "PR #51084 is merged: stop the personal desktop distribution."
            exit 0
          fi
          if [[ "$(jq -r '.head.repo.full_name' <<< "$pr")" != aimansour/opencode ||
                "$(jq -r '.head.ref' <<< "$pr")" != streaming-steps-a11y ||
                "$(jq -r '.base.ref' <<< "$pr")" != v2 ]]; then
            echo "Unexpected PR owner or refs. Manual review required." >&2
            exit 1
          fi
          issues="$(gh issue list -R aimansour/opencode --state open --limit 1000 --json title --jq '.[].title')"
          if grep -Eq '\[a11y-release-(blocked|stop)\]' <<< "$issues" && [[ "$VERIFY_ONLY" != true ]]; then
            blockers="$(gh issue list -R aimansour/opencode --state open --limit 1000 --json number,title --jq '.[] | select(.title | startswith("[a11y-release-")) | .number')"
            if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_TAG" == v2.0.18 &&
                  "$HOTFIX_SUFFIX" == r1 && "$blockers" == 7 &&
                  "$issues" == *'[a11y-release-blocked] Windows Desktop v2.0.18 hangs during install and opens blank window'* ]]; then
              echo 'Allowing only the explicit Windows v2.0.18-r1 repair while issue #7 holds all other personal releases.'
            else
              echo "Personal release stopped by an open issue (verification-only is still allowed)."
              exit 0
            fi
          fi
          tags="$(git ls-remote --refs --tags https://github.com/anomalyco/opencode.git 'refs/tags/v2.*' |
            awk '{sub("refs/tags/", "", $2); print $2}' |
            grep -E '^v2\.[0-9]+\.[0-9]+$' | sort -V)"
          eligible=0
          while IFS= read -r tag; do
            [[ "$tag" == v2.0.18 ]] && eligible=1
            [[ "$eligible" == 1 ]] || continue
            [[ -z "$REQUESTED_TAG" || "$tag" == "$REQUESTED_TAG" ]] || continue
            if ! cli="$(gh api "repos/aimansour/opencode/releases/tags/a11y-$tag" 2>/dev/null)"; then
              echo "CLI for $tag is not yet released; retry on the next scheduled run."
              break
            fi
            if ! python3 "$GITHUB_WORKSPACE/automation/.github/scripts/personal-v2/verify_release.py" cli "$tag" <<< "$cli"; then
              if ! gh issue list -R aimansour/opencode --state open --limit 1000 --json title --jq '.[].title' | grep -Fq '[a11y-release-blocked]'; then
                gh issue create -R aimansour/opencode --title "[a11y-release-blocked] incomplete CLI release $tag" \
                  --body "Windows Desktop refused to use the incomplete personal CLI release a11y-$tag. Inspect release asset names, sizes and SHA-256 digests before closing this issue."
              fi
              exit 1
            fi
            desktop_tag="a11y-desktop-$tag${HOTFIX_SUFFIX:+-$HOTFIX_SUFFIX}"
            if desktop="$(gh release view "$desktop_tag" -R aimansour/opencode --json isDraft,assets 2>/dev/null)"; then
              if ! python3 "$GITHUB_WORKSPACE/automation/.github/scripts/personal-v2/verify_release.py" windows "$tag" <<< "$desktop"; then
                gh issue create -R aimansour/opencode --title "[a11y-release-blocked] incomplete $desktop_tag" \
                  --body "The Windows desktop release is a draft, lacks expected files, or has missing assets or hashes. Inspect https://github.com/aimansour/opencode/releases/tag/$desktop_tag and repair it manually before closing this issue."
                exit 1
              fi
              [[ "$VERIFY_ONLY" == true ]] || continue
            elif [[ "$VERIFY_ONLY" == true ]]; then
              echo "Verification-only requested but $desktop_tag does not exist." >&2
              exit 1
            fi
            {
              echo "build=true"
              echo "tag=$tag"
              echo "release_tag=$desktop_tag"
            } >> "$GITHUB_OUTPUT"
            echo "Selected Windows Desktop $tag based on personal CLI a11y-$tag."
            break
          done <<< "$tags"

  build-windows-desktop:
    needs: select
    if: needs.select.outputs.build == 'true' && vars.PERSONAL_A11Y_STOP != 'true'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.select.outputs.tag }}
      RELEASE_TAG: ${{ needs.select.outputs.release_tag }}
      OPENCODE_CHANNEL: a11y
      OPENCODE_CLI_TARGET: x86_64-pc-windows-msvc
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout independent automation
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
          sparse-checkout: .github/scripts/personal-v2

      - name: Checkout the exact already-tested personal CLI source tag
        uses: actions/checkout@v4
        with:
          repository: aimansour/opencode
          ref: a11y-${{ needs.select.outputs.tag }}
          path: source
          persist-credentials: false
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Brand only the already-tested personal source for Windows Desktop
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Personal source tag did not resolve to a commit.' }
          python "$env:GITHUB_WORKSPACE/automation/.github/scripts/personal-v2/desktop_brand.py" $PWD.Path
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(desktop): independent Windows A11y identity for $env:TAG"
          "PERSONAL_SOURCE_SHA=$sourceCommit" >> $env:GITHUB_ENV
          "OPENCODE_VERSION=$($env:TAG.Substring(1))" >> $env:GITHUB_ENV

      - name: Download and hash-check the exact CLI built by the personal workflow
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:TAG.Substring(1)
          $name = "opencode-a11y-$version-windows-x64-baseline.zip"
          gh release download "a11y-$env:TAG" -R aimansour/opencode --pattern $name --pattern BUILD_INFO.txt --dir $env:RUNNER_TEMP
          $release = gh api "repos/aimansour/opencode/releases/tags/a11y-$env:TAG" | ConvertFrom-Json
          if ($release.draft -or $release.assets.Count -ne 14) { throw 'Personal CLI release is incomplete.' }
          $asset = @($release.assets | Where-Object { $_.name -eq $name })
          if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded') { throw 'Missing tested Windows CLI archive.' }
          $archive = Join-Path $env:RUNNER_TEMP $name
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset[0].digest -ne "sha256:$hash") { throw 'Personal CLI release archive hash mismatch.' }
          $infoAsset = @($release.assets | Where-Object { $_.name -eq 'BUILD_INFO.txt' })
          $infoPath = Join-Path $env:RUNNER_TEMP 'BUILD_INFO.txt'
          if ($infoAsset.Count -ne 1 -or $infoAsset[0].state -ne 'uploaded') { throw 'Missing CLI build provenance.' }
          $infoHash = (Get-FileHash $infoPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($infoAsset[0].digest -ne "sha256:$infoHash") { throw 'CLI provenance hash mismatch.' }
          $infoText = Get-Content $infoPath -Raw
          $sourceMatch = [regex]::Match($infoText, '(?m)^Personal source commit: ([0-9a-f]{40})\r?$')
          $prMatch = [regex]::Match($infoText, '(?m)^PR commit: ([0-9a-f]{40})\r?$')
          if (!$sourceMatch.Success -or !$prMatch.Success -or $sourceMatch.Groups[1].Value -ne $env:PERSONAL_SOURCE_SHA) {
            throw 'The Windows Desktop source does not match the verified CLI release source.'
          }
          "SOURCE_PR_SHA=$($prMatch.Groups[1].Value)" >> $env:GITHUB_ENV
          $target = Join-Path $PWD.Path 'packages/cli/dist/cli-windows-x64-baseline'
          Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
          $manifest = Get-Content (Join-Path $target 'package.json') -Raw | ConvertFrom-Json
          if ($manifest.name -ne '@aimansour/cli-windows-x64-baseline' -or $manifest.version -ne $version) {
            throw 'Wrong CLI distribution name or version.'
          }
          $binary = Join-Path $target 'bin/opencode-a11y.exe'
          if (!(Test-Path $binary) -or (Get-Item $binary).Length -lt 1000000) { throw 'Personal CLI executable is missing.' }
          "PERSONAL_CLI_SHA256=$((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Install frozen dependencies, typecheck and test Desktop
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          bun run --cwd packages/session-ui typecheck
          bun run --cwd packages/desktop typecheck
          bun run --cwd packages/desktop test

      - name: Build Desktop using the downloaded workflow-built personal CLI
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:OPENCODE_CLI_DIST = Join-Path $PWD.Path 'packages/cli/dist'
          bun run --cwd packages/desktop prebuild
          $bundled = 'packages/desktop/resources/opencode-cli.exe'
          if (!(Test-Path $bundled)) { throw 'Prebuild did not embed the personal Windows CLI.' }
          if ((Get-FileHash $bundled -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PERSONAL_CLI_SHA256) {
            throw 'Bundled CLI differs from the exact personal workflow-built executable.'
          }
          bun run --cwd packages/desktop build
          Push-Location packages/desktop
          try { bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts }
          finally { Pop-Location }

      - name: Verify installer and packaged CLI before publication
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD.Path 'packages/desktop/dist'
          $installers = @(Get-ChildItem $dist -File -Filter 'opencode-a11y-desktop-*-x64.exe')
          if ($installers.Count -ne 1 -or $installers[0].Length -lt 1000000) { throw 'Expected exactly one non-empty x64 NSIS installer.' }
          $unpacked = Join-Path $dist 'win-unpacked'
          $embedded = Join-Path $unpacked 'resources/opencode-cli.exe'
          $desktop = Join-Path $unpacked 'opencode-a11y-desktop.exe'
          if (!(Test-Path $desktop) -or !(Test-Path $embedded)) { throw 'Packaged Desktop or CLI is missing.' }
          if ((Get-FileHash $embedded -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PERSONAL_CLI_SHA256) {
            throw 'Packaged Desktop includes an unverified or official CLI.'
          }
          $version = (Get-Content (Join-Path $unpacked 'resources/opencode-cli.version') -Raw).Trim()
          if ($version -ne $env:TAG.Substring(1)) { throw 'Packaged CLI version does not match the release.' }
          $updateConfig = Join-Path $unpacked 'resources/app-update.yml'
          if (Test-Path $updateConfig) {
            if ((Get-Content $updateConfig -Raw) -match 'opencode\.ai|anomalyco/opencode') {
              throw 'Personal Desktop contains an official updater endpoint.'
            }
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'desktop-release'
          New-Item $out -ItemType Directory -Force | Out-Null
          Copy-Item $installers[0].FullName (Join-Path $out $installers[0].Name)
          @(
            "Official source: $env:TAG"
            "Personal Windows release: $env:RELEASE_TAG"
            "Original accessibility PR: https://github.com/anomalyco/opencode/pull/51084"
            "PR commit from verified CLI release: $env:SOURCE_PR_SHA"
            "Verified personal CLI source: $env:PERSONAL_SOURCE_SHA"
            "Patched Desktop source: $(git rev-parse HEAD)"
            "Tested personal CLI release: a11y-$env:TAG"
            "Embedded CLI SHA256: $env:PERSONAL_CLI_SHA256"
            "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content (Join-Path $out 'BUILD_INFO.txt')
          $installer = Get-ChildItem $out -Filter '*.exe' | Select-Object -First 1
          "$((Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($installer.Name)" |
            Set-Content (Join-Path $out 'SHA256SUMS')
          "INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV

      - name: Install the generated NSIS installer and verify an actually usable GUI
        shell: pwsh
        run: |
          ./automation/.github/scripts/personal-v2/windows_installer_smoke.ps1 -Installer $env:INSTALLER -ExpectedCliHash $env:PERSONAL_CLI_SHA256 -ReportDir "$env:GITHUB_WORKSPACE/smoke-output"

      - name: Retain runtime-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-smoke-${{ github.run_id }}
          path: |
            smoke-output/installer-result.json
            smoke-output/smoke-result.json
            smoke-output/desktop-window.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Recheck PR and push immutable patched Desktop source tag
        if: ${{ !inputs.verify_only }}
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $live = gh api repos/anomalyco/opencode/pulls/51084 | ConvertFrom-Json
          if ($live.merged) { throw 'PR was merged; refuse Desktop release.' }
          $ref = "refs/tags/$env:RELEASE_TAG"
          $remote = @(git ls-remote https://github.com/aimansour/opencode.git $ref)
          if ($remote.Count -gt 0) {
            git fetch --no-tags --depth=1 https://github.com/aimansour/opencode.git $ref
            if ((git rev-parse 'FETCH_HEAD^{tree}').Trim() -ne (git rev-parse 'HEAD^{tree}').Trim()) {
              throw 'Existing desktop source tag differs from this verified build.'
            }
          } else {
            $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/aimansour/opencode.git "HEAD:$ref"
          }

      - name: Publish draft only after checking all installer assets
        if: ${{ !inputs.verify_only }}
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $live = gh api repos/anomalyco/opencode/pulls/51084 | ConvertFrom-Json
          if ($live.merged) { throw 'PR was merged before publishing.' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'desktop-release'
          $files = @(Get-ChildItem $out -File)
          if ($files.Count -ne 3) { throw 'Expected installer, SHA256SUMS and provenance.' }
          $notes = Join-Path $env:RUNNER_TEMP 'desktop-release-notes.md'
          @(
            "Personal OpenCode V2 $env:TAG Windows x64 Desktop with accessibility fix #51084."
            "Release tag: $env:RELEASE_TAG"
            "Install location: %LOCALAPPDATA%\Programs\OpenCode-A11y (separate from official OpenCode)."
            "This installer passed a real NSIS install, bundled CLI hash, and usable GUI startup test on Windows."
            ""
            "Install separately from official OpenCode: name OpenCode A11y, app ID ai.aimansour.opencode.a11y, separate user data."
            "The bundled opencode-a11y.exe was built by the personal CLI workflow for the same official V2 tag and its hash was checked before and after packaging."
            "Official CLI and Desktop updaters are disabled. Install future personal Desktop releases manually from this fork."
            "This is an unsigned personal Windows installer; Windows SmartScreen may display a warning."
          ) | Set-Content $notes
          $title = "OpenCode A11y Windows Desktop $env:TAG"
          if ($env:RELEASE_TAG -ne "a11y-desktop-$env:TAG") {
            $title = "$title (verified hotfix $env:RELEASE_TAG)"
            $original = Get-Content $notes -Raw
            "Verified hotfix for Windows startup issue #7. The original Windows installer is retained as a flagged prerelease and must not be used.`n`n$original" | Set-Content $notes
          }
          gh release create $env:RELEASE_TAG @($files | ForEach-Object { $_.FullName }) -R aimansour/opencode --verify-tag --draft --title $title --notes-file $notes
          # REST releases/tags returns 404 for drafts; gh release view includes drafts.
          $release = gh release view $env:RELEASE_TAG -R aimansour/opencode --json isDraft,assets | ConvertFrom-Json
          if (!$release.isDraft -or $release.assets.Count -ne 3) { throw 'Draft or asset count verification failed.' }
          foreach ($file in $files) {
            $matches = @($release.assets | Where-Object { $_.name -eq $file.Name -and $_.size -eq $file.Length -and $_.state -eq 'uploaded' })
            if ($matches.Count -ne 1) { throw "Missing uploaded asset: $($file.Name)" }
            $digest = "sha256:$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ($matches[0].digest -ne $digest) { throw "Uploaded asset checksum differs: $($file.Name)" }
          }
          gh release edit $env:RELEASE_TAG -R aimansour/opencode --draft=false
          $published = gh api "repos/aimansour/opencode/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($published.draft -or $published.assets.Count -ne 3) { throw 'Desktop release did not publish correctly.' }

      - name: Block subsequent releases on a build, conflict, or publish failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $titles = @(gh issue list -R aimansour/opencode --state open --limit 1000 --json title --jq '.[].title')
          if ($titles | Where-Object { $_ -match '\[a11y-release-blocked\]' }) { exit 0 }
          gh issue create -R aimansour/opencode --title "[a11y-release-blocked] Windows Desktop $env:TAG" --body "Windows Desktop build, patch, source verification or release failed. Inspect $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID. Resolve manually and close this issue to resume both personal release workflows."
